[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apc-metro"
version = "0.1.0"
description = "Prototipo local de conteo de pasajeros por puerta"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.10,<5", "ultralytics>=8.3,<8.4", "lap>=0.5,<0.6", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
