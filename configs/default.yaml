# Rutas relativas al directorio padre de configs/.
source:
  type: file
  path: data/demo.avi
  index: 0
  url: ""
  width: 640
  height: 480
  queue_size: 2
  open_timeout_ms: 5000
  read_timeout_ms: 2000
  realtime: false
  loop: false
detection:
  model: models/yolov8n.pt
  imgsz: 320
  conf: 0.35
  vid_stride: 1
  torch_threads: 0
  min_area_ratio: 0.005
  max_area_ratio: 0.85
counting:
  orientation: horizontal
  position: 0.5
  band_half_width: 0.04
  enter_direction: positive
  min_track_frames: 3
  max_missing_frames: 2
occupancy:
  capacity: 100
  initial: 0
  green_below: 0.40
  red_above: 0.75
telemetry:
  port: 8765
  wagon_id: 1
  interval_seconds: 0.5
  stale_after_seconds: 3.0
  simulated_wagons: 4
simulation:
  # Los primeros tres vagones oscilan alrededor de estos objetivos.
  period_seconds: 120.0
  maximum_ratio: 1.10
  low_target_ratio: 0.20
  medium_target_ratio: 0.60
  high_target_ratio: 0.90
  variation_ratio: 0.10
  # El cuarto recorre de vacío al máximo; los perfiles se repiten si hay más vagones.
  variable_initial_ratio: 0.35
  fake_fps: 15.0
  fake_cycle_seconds: 8.0
visualization:
  # Optativo: MJPEG solo en 127.0.0.1; nunca se graba video.
  stream: false
  show_line: true
  show_band: true
  show_boxes: true
  show_ids: true
  show_trails: false
  show_counters: true
  trail_length: 20
  # Colores RGB (el overlay convierte al BGR de OpenCV).
  line_color: "#0000FF"
  band_color: "#64748B"
  box_color: "#00DFFF"
  trail_color: "#FFD166"
  in_color: "#00FF00"
  out_color: "#FF0000"
  occupancy_color: "#FFFFFF"
  jpeg_quality: 80
  max_fps: 10.0
debug:
  show_video: false
  # Diagnóstico textual de tracks; no activa ni guarda imágenes.
  counting: false
