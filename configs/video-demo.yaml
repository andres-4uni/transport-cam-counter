# Demo local del MOV autorizado, basada en visual-demo.yaml.
# Los campos omitidos usan las dataclasses; no se hereda default.yaml.
source:
  type: file
  path: data/demo1.mov
  realtime: true
  loop: true
visualization:
  stream: true
  show_trails: true
counting:
  orientation: vertical
  position: 0.64
  band_half_width: 0.04
  enter_direction: left
  min_track_frames: 3
  max_missing_frames: 2
