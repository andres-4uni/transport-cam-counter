# Cámara fija cenital: umbral entre piso café y baldosa clara (y≈0.60).
# Perfil independiente; no hereda default.yaml ni video-demo.yaml.
source:
  type: file
  path: data/demo2.mov
  realtime: true
  loop: true
detection:
  model: models/yolov8n.pt
  tracker: configs/door-bytetrack.yaml
  imgsz: 416
  conf: 0.10
  vid_stride: 1
  torch_threads: 0
  min_area_ratio: 0.005
  max_area_ratio: 0.85
counting:
  orientation: horizontal
  position: 0.60
  band_half_width: 0.04
  enter_direction: down
  min_track_frames: 3
  # 5 ausencias ≈0.168 s a 29.793 FPS; menor presupuesto ensayado de 0.20 s
  # que conserva los cuatro IN observables. No une IDs distintos.
  max_missing_frames: 5
visualization:
  stream: true
  show_trails: true
